<app-header />

<main class="container">
  <div class="page-header">
    <span class="title-bar"></span>
    <h1 class="page-title">Cadastro de Clientes</h1>

    <span class="back-link" (click)="cancel()">← Voltar</span>
  </div>

  <form class="form" [formGroup]="form" (ngSubmit)="save()">
    <div class="row">
      <div class="row-half">
        <div class="field">
          <label class="field-label is-required" for="id">ID</label>
          <mat-form-field appearance="outline" class="field-material">
            <input
              matInput
              id="id"
              type="number"
              min="1"
              formControlName="id"
              [errorStateMatcher]="errorMatcher"
              (input)="duplicateIdError.set('')"
            />
          </mat-form-field>
          <span class="field-error" *ngIf="duplicateIdError()">{{ duplicateIdError() }}</span>
        </div>

        <div class="field">
          <label class="field-label is-required" for="cnpj">CNPJ</label>
          <div class="cnpj-line">
            <mat-form-field appearance="outline" class="field-material">
              <input
                matInput
                id="cnpj"
                type="text"
                formControlName="cnpj"
                placeholder="00.000.000/0000-00"
                maxlength="18"
                [errorStateMatcher]="errorMatcher"
                (input)="onCnpjInput($event)"
              />
            </mat-form-field>
            <button type="button" mat-flat-button class="btn-buscar" (click)="searchCnpj()">
              BUSCAR
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="row row-half">
      <div class="field">
        <label class="field-label is-required" for="companyName">RAZÃO SOCIAL</label>
        <mat-form-field appearance="outline" class="field-material">
          <input matInput id="companyName" type="text" formControlName="companyName" [errorStateMatcher]="errorMatcher" />
        </mat-form-field>
      </div>

      <div class="field">
        <label class="field-label is-required" for="email">E-MAIL</label>
        <mat-form-field appearance="outline" class="field-material">
          <input matInput id="email" type="email" formControlName="email" [errorStateMatcher]="errorMatcher" />
        </mat-form-field>
      </div>
    </div>

    <div class="row row-actions">
      <button type="button" mat-stroked-button class="btn-cancel" (click)="cancel()">CANCELAR</button>
      <button type="submit" mat-flat-button class="btn-save">SALVAR</button>
    </div>
  </form>
</main>
