version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: desafio-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-desafio_excellent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-desafio_excellent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - desafio-network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: desafio-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@desafio.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - desafio-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  desafio-network:
    driver: bridge