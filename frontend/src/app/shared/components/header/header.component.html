<header class="header">
  <div class="header-inner">
    <a routerLink="/" class="logo-link" aria-label="Ir para a página inicial">
      <img src="/logo-excellent.png" alt="Excellent Sistemas" class="logo" />
    </a>
    <app-menu />
    <span class="brand-text">PAINEL ADMINISTRATIVO</span>

    <button
      type="button"
      mat-icon-button
      disableRipple
      class="menu-toggle"
      aria-label="Abrir menu"
      [matMenuTriggerFor]="appMenu"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #appMenu="matMenu" xPosition="before" class="app-menu">
      <a mat-menu-item routerLink="/clientes">Clientes</a>
      <a mat-menu-item routerLink="/produtos">Produtos</a>
      <a mat-menu-item routerLink="/pedidos">Pedidos</a>
    </mat-menu>
  </div>
</header>
